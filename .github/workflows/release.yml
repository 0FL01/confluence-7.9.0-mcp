name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.diff.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect release-relevant changes
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=$(git hash-object -t tree -w /dev/null)
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base"
          fi
          status=0
          git diff --quiet --no-renames "$base" "$GITHUB_SHA" -- \
            . ':(exclude,glob)**/*.md' || status=$?
          case "$status" in
            0) echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  release:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Release metadata and commit notes
        id: meta
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short=12 "$GITHUB_SHA")
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          day=$(date -u -d "@$epoch" +%Y%m%d)
          tag="release-$day-$short_sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          previous=$(git describe --tags --match 'release-*' --abbrev=0 \
            "$GITHUB_SHA^" 2>/dev/null || true)
          base="$previous"
          if [[ -z "$base" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE_SHA"
            fi
            base="$BEFORE_SHA"
          fi
          range="$GITHUB_SHA"
          [[ -z "$base" ]] || range="$base..$GITHUB_SHA"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            printf '# %s\n\n' "$tag"
            if [[ -n "$previous" ]]; then
              printf 'Previous release: [%s](%s/releases/tag/%s)\n\n' \
                "$previous" "$url" "$previous"
            elif [[ -n "$base" ]]; then
              printf 'Previous commit: [%s](%s/commit/%s)\n\n' "$base" "$url" "$base"
            else
              printf 'Initial release.\n\n'
            fi
            printf 'New commits: %s\n\n' "$(git rev-list --count "$range")"
            git log --reverse --format="- [%h]($url/commit/%H) %s" "$range"
            if [[ -n "$base" ]]; then
              printf '\n[Full diff](%s/compare/%s...%s)\n' "$url" "$base" "$GITHUB_SHA"
            fi
          } > .release-notes.md
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          install-only: true
      - name: Check release configuration
        run: goreleaser check
      - name: Build archives
        run: goreleaser release --snapshot --clean
      - name: Verify assets and finish notes
        run: |
          set -euo pipefail
          assets=(
            confluence-mcp_linux_amd64.tar.gz
            confluence-mcp_linux_arm64.tar.gz
            confluence-mcp_darwin_amd64.tar.gz
            confluence-mcp_darwin_arm64.tar.gz
            confluence-mcp_windows_amd64.zip
            confluence-mcp_windows_arm64.zip
            checksums.txt
          )
          for asset in "${assets[@]}"; do
            test -s "dist/$asset"
          done
          (cd dist && sha256sum --check checksums.txt)
          {
            printf '\n## Artifacts\n\n'
            printf -- '- `%s`\n' "${assets[@]}"
          } >> .release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: .release-notes.md
          files: |
            dist/confluence-mcp_linux_amd64.tar.gz
            dist/confluence-mcp_linux_arm64.tar.gz
            dist/confluence-mcp_darwin_amd64.tar.gz
            dist/confluence-mcp_darwin_arm64.tar.gz
            dist/confluence-mcp_windows_amd64.zip
            dist/confluence-mcp_windows_arm64.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
          make_latest: true
